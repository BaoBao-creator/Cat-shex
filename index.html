
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Chat</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #e2e8f0;
      background: #0f172a;
    }

    .panel {
      width: 100%;
      max-width: 650px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
    }

    [hidden] { display: none !important; }

    #loginPanel {
      max-width: 420px;
      padding: 24px;
    }

    h1 { margin-top: 0; }

    input {
      width: 100%;
      min-width: 0;
      padding: 12px;
      color: white;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      outline: none;
    }

    input:focus { border-color: #38bdf8; }

    button {
      padding: 12px 16px;
      color: white;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #loginForm {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #chatPanel {
      height: min(750px, 90vh);
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    #chatPanel[hidden] { display: none !important; }

    header {
      padding: 16px;
      border-bottom: 1px solid #334155;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
    }

    .muted {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px;
      background: #334155;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .message p {
      margin: 0 0 7px;
      white-space: pre-wrap;
    }

    .time {
      color: #94a3b8;
      font-size: 12px;
    }

    #messageForm {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid #334155;
    }

    #messageForm input { flex: 1; }

    #loginStatus, #chatStatus {
      min-height: 20px;
      margin-top: 10px;
    }

    #emptyMessage {
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- Màn hình đăng nhập -->
  <section id="loginPanel" class="panel">
    <h1>Simple Chat</h1>
    <p>Chỉ tài khoản được cấp quyền mới có thể vào phòng chat.</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Email của bạn"
        autocomplete="email"
        required
      >
      <button id="loginButton" type="submit">
        Gửi link đăng nhập
      </button>
    </form>

    <p class="muted">
      Bạn sẽ nhận được email chứa đường link đăng nhập.
      Hãy mở link đó để vào phòng chat.
    </p>
    <p id="loginStatus" class="muted" role="status"></p>
  </section>

  <!-- Phòng chat -->
  <section id="chatPanel" class="panel" hidden>
    <header>
      <div class="topbar">
        <h1>Simple Chat</h1>
        <button id="logoutButton" type="button">Đăng xuất</button>
      </div>
      <div id="chatStatus" class="muted">Đang kết nối...</div>
    </header>

    <div id="messages" aria-live="polite"></div>

    <form id="messageForm">
      <input
        id="content"
        type="text"
        maxlength="1000"
        placeholder="Nhập tin nhắn..."
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit">Gửi</button>
    </form>
  </section>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // Dùng Project URL và Publishable key của bạn.
    const SUPABASE_URL =
      "https://fmnyjkpttuvnevhqazqb.supabase.co";

    const SUPABASE_KEY =
      "DAN_PUBLISHABLE_KEY_CUA_BAN";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginPanel = document.getElementById("loginPanel");
    const chatPanel = document.getElementById("chatPanel");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const loginButton = document.getElementById("loginButton");
    const loginStatus = document.getElementById("loginStatus");
    const chatStatus = document.getElementById("chatStatus");
    const messagesBox = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const contentInput = document.getElementById("content");
    const sendButton = document.getElementById("sendButton");
    const logoutButton = document.getElementById("logoutButton");

    let currentUserId = null;
    let checkingSession = 0;
    let loadingMessages = false;

    function showLogin(message = "") {
      chatPanel.hidden = true;
      loginPanel.hidden = false;
      loginStatus.textContent = message;
    }

    async function enterChat(session) {
      const checkId = ++checkingSession;

      if (!session) {
        currentUserId = null;
        showLogin();
        return;
      }

      // Kiểm tra tài khoản có nằm trong allowlist hay không.
      const { data, error } = await supabase
        .from("allowed_users")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (checkId !== checkingSession) return;

      if (error) {
        await supabase.auth.signOut();
        showLogin(
          "Không kiểm tra được quyền truy cập. Hãy thử lại."
        );
        console.error("Lỗi kiểm tra quyền:", error);
        return;
      }

      if (!data) {
        await supabase.auth.signOut();
        showLogin(
          "Tài khoản này chưa được cấp quyền sử dụng chat."
        );
        return;
      }

      loginPanel.hidden = true;
      chatPanel.hidden = false;
      chatStatus.textContent = "Đã đăng nhập thành công.";

      if (currentUserId !== session.user.id) {
        currentUserId = session.user.id;
        await loadMessages();
      }
    }

    // Gửi magic link, không cho phép tự tạo tài khoản.
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      if (!email) return;

      loginButton.disabled = true;
      loginStatus.textContent = "Đang gửi email đăng nhập...";

      try {
        const { error } = await supabase.auth.signInWithOtp({
          email,
          options: {
            shouldCreateUser: false,
            emailRedirectTo: window.location.origin
          }
        });

        if (error) throw error;

        loginStatus.textContent =
          "Đã gửi yêu cầu. Hãy kiểm tra hộp thư và thư mục Spam.";
      } catch (error) {
        console.error("Lỗi đăng nhập:", error);
        loginStatus.textContent =
          "Không gửi được link. Hãy kiểm tra email, cấu hình Auth và thử lại.";
      } finally {
        loginButton.disabled = false;
      }
    });

    async function loadMessages() {
      if (loadingMessages || chatPanel.hidden) return;

      loadingMessages = true;

      try {
        const { data, error } = await supabase
          .from("messages")
          .select("id, content, created_at")
          .order("created_at", { ascending: false })
          .limit(100);

        if (error) throw error;

        const nearBottom =
          messagesBox.scrollHeight -
          messagesBox.scrollTop -
          messagesBox.clientHeight < 80;

        data.reverse();

        const fragment = document.createDocumentFragment();

        for (const message of data) {
          const item = document.createElement("article");
          item.className = "message";

          const text = document.createElement("p");
          text.textContent = message.content;

          const time = document.createElement("div");
          time.className = "time";
          time.textContent = new Date(
            message.created_at
          ).toLocaleString("vi-VN");

          item.append(text, time);
          fragment.appendChild(item);
        }

        if (data.length === 0) {
          const empty = document.createElement("p");
          empty.id = "emptyMessage";
          empty.textContent = "Chưa có tin nhắn nào.";
          fragment.appendChild(empty);
        }

        messagesBox.replaceChildren(fragment);

        if (nearBottom) {
          messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        chatStatus.textContent =
          "Đã tải " + data.length + " tin nhắn gần nhất.";
      } catch (error) {
        console.error("Lỗi tải tin nhắn:", error);
        chatStatus.textContent =
          "Không tải được tin nhắn. Kiểm tra quyền database.";
      } finally {
        loadingMessages = false;
      }
    }

    messageForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const content = contentInput.value.trim();
      if (!content || sendButton.disabled) return;

      sendButton.disabled = true;

      try {
        const { error } = await supabase
          .from("messages")
          .insert({ content });

        if (error) throw error;

        contentInput.value = "";
        await loadMessages();
        contentInput.focus();
      } catch (error) {
        console.error("Lỗi gửi tin:", error);
        chatStatus.textContent =
          "Gửi thất bại. Hãy kiểm tra kết nối và quyền truy cập.";
      } finally {
        sendButton.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      const { error } = await supabase.auth.signOut();

      if (error) {
        chatStatus.textContent = "Không thể đăng xuất. Hãy thử lại.";
        console.error(error);
      }
    });

    // Tránh gọi API trực tiếp bên trong callback auth.
    supabase.auth.onAuthStateChange((_event, session) => {
      setTimeout(() => {
        enterChat(session);
      }, 0);
    });

    const { data: { session } } = await supabase.auth.getSession();
    await enterChat(session);

    // Làm mới tin nhắn mỗi 5 giây.
    setInterval(() => {
      if (!chatPanel.hidden) loadMessages();
    }, 5000);
  </script>
</body>
</html>
