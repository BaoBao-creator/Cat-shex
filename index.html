<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Serverless Voice Chat</title>
</head>
<body>
    <!-- Nhúng thư viện PeerJS từ CDN -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        // Tên phòng chung độc nhất của bạn (các máy khác phải dùng chung tên này)
        const ROOM_ID = 'phong-voice-bi-mat-xyz-123';
        const HOST_ID = ROOM_ID + '-host';

        // Tự động xin quyền Microphone ngay khi mở trang
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                // Thử đăng ký làm Host của phòng trước
                const peer = new Peer(HOST_ID);

                peer.on('open', id => {
                    console.log('Bạn là Host của phòng.');
                    setupHost(peer, stream);
                });

                // Nếu ID Host đã có người chiếm (đã có máy khác mở trước), ta sẽ tự động vào làm Client
                peer.on('error', err => {
                    if (err.type === 'unavailable-id') {
                        console.log('Phòng đã có Host, đang kết nối vào...');
                        const clientPeer = new Peer();
                        clientPeer.on('open', () => {
                            setupClient(clientPeer, stream, HOST_ID);
                        });
                    }
                });
            })
            .catch(err => console.error('Lỗi quyền Microphone:', err));

        function playAudioStream(stream) {
            const audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.playsInline = true;
            document.body.appendChild(audio);
        }

        function setupHost(peer, stream) {
            // Host lắng nghe kết nối từ các máy khác gọi vào
            peer.on('call', call => {
                call.answer(stream); // Gửi âm thanh của mình lại cho họ
                call.on('stream', remoteStream => {
                    playAudioStream(remoteStream); // Phát âm thanh của họ
                });
            });
        }

        function setupClient(peer, stream, hostId) {
            // Client gọi trực tiếp tới Host để thiết lập truyền âm thanh 2 chiều
            const call = peer.call(hostId, stream);
            call.on('stream', remoteStream => {
                playAudioStream(remoteStream); // Phát âm thanh nhận được từ phòng
            });
        }
    </script>
</body>
</html>
