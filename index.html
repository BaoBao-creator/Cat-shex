<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        .chat {
            width: 100%;
            max-width: 650px;
            height: min(750px, 90vh);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
        }

        header {
            padding: 18px;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        #status {
            color: #94a3b8;
            font-size: 13px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px;
            overflow-wrap: anywhere;
            background: #334155;
            border-radius: 10px;
        }

        .message p {
            margin: 0 0 7px;
            white-space: pre-wrap;
        }

        .time {
            color: #94a3b8;
            font-size: 12px;
        }

        #form {
            display: flex;
            gap: 8px;
            padding: 14px;
            border-top: 1px solid #334155;
        }

        #content {
            flex: 1;
            min-width: 0;
            padding: 12px;
            color: white;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            outline: none;
        }

        #content:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 0 18px;
            color: white;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <main class="chat">
        <header>
            <h1>Simple Chat</h1>
            <div id="status">Đang kết nối...</div>
        </header>

        <section id="messages" aria-live="polite">
            <p>Đang tải tin nhắn...</p>
        </section>

        <form id="form">
            <input id="content" type="text" maxlength="1000" placeholder="Nhập tin nhắn..." autocomplete="off" required>
            <button id="send" type="submit">Gửi</button>
        </form>
    </main>

    <script type="module">
        import {createClient} from
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        // THAY HAI GIÁ TRỊ NÀY BẰNG THÔNG TIN CỦA BẠN
        const SUPABASE_URL = "https://fmnyjkpttuvnevhqazqb.supabase.co";
        const SUPABASE_KEY = "sb_publishable_T69B4e_uLdNK-UIectLeRA_DaLvemNQ";

        const messagesBox = document.getElementById("messages");
        const statusBox = document.getElementById("status");
        const form = document.getElementById("form");
        const input = document.getElementById("content");
        const sendButton = document.getElementById("send");

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        let loading = false;

        function setStatus(message) {
            statusBox.textContent = message;
        }

        async function loadMessages() {
            if (loading) return;
            loading = true;

            try {
                const {data, error} = await supabase
                    .from("messages")
                    .select("id, content, created_at")
                    .order("created_at", {ascending: false})
                    .limit(100);

                if (error) throw error;

                // Đảo lại để tin cũ nằm trên, tin mới nằm dưới.
                data.reverse();

                const nearBottom =
                    messagesBox.scrollHeight -
                    messagesBox.scrollTop -
                    messagesBox.clientHeight < 80;

                const fragment = document.createDocumentFragment();

                for (const message of data) {
                    const item = document.createElement("article");
                    item.className = "message";

                    const text = document.createElement("p");
                    text.textContent = message.content;

                    const time = document.createElement("div");
                    time.className = "time";
                    time.textContent = new Date(
                        message.created_at
                    ).toLocaleString("vi-VN");

                    item.append(text, time);
                    fragment.appendChild(item);
                }

                messagesBox.replaceChildren(fragment);

                if (data.length === 0) {
                    const empty = document.createElement("p");
                    empty.textContent = "Chưa có tin nhắn nào. Hãy gửi tin đầu tiên!";
                    messagesBox.appendChild(empty);
                }

                if (nearBottom) {
                    messagesBox.scrollTop = messagesBox.scrollHeight;
                }

                setStatus("Đã kết nối • " + data.length + " tin gần nhất");
            } catch (error) {
                console.error("Lỗi tải tin nhắn:", error);
                setStatus("Không tải được tin nhắn. Kiểm tra cấu hình và quyền database.");
            } finally {
                loading = false;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const content = input.value.trim();
            if (!content || sendButton.disabled) return;

            sendButton.disabled = true;

            try {
                const {error} = await supabase
                    .from("messages")
                    .insert({content});

                if (error) throw error;

                input.value = "";
                await loadMessages();
                input.focus();
            } catch (error) {
                console.error("Lỗi gửi tin nhắn:", error);
                setStatus("Gửi thất bại. Hãy kiểm tra kết nối và quyền database.");
            } finally {
                sendButton.disabled = false;
            }
        });

        // Lấy tin lúc mở trang và tải lại mỗi 5 giây.
        await loadMessages();
        setInterval(loadMessages, 5000);
    </script>
</body>

</html>
